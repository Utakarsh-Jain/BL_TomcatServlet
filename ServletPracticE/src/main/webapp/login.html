
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>
<body>

<!-- Login Page Heading -->
<h1>Login Form</h1>

<!-- Form sends user credentials to LoginServlet -->
<!-- POST method is used to submit username and password -->
<form action="login" method="post">

    <!-- Username Input -->
    <label>Username:</label>
    <input type="text" name="username" required>

    <br><br>

    <!-- Password Input -->
    <label>Password:</label>
    <input type="password" name="password" required>

    <br><br>

    <!-- Submit Button -->
    <button type="submit">Login</button>

</form>

</body>
</html>
